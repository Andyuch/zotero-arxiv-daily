name: Zotero latestness audit

on:
  push:
    branches:
      - zotero-library-audit
    paths:
      - '.github/workflows/zotero-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: zotero-library-audit

      - name: Install pyzotero only
        run: python -m pip install -q pyzotero

      - name: List latest 20 Zotero papers
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
        run: |
          python - <<'PY'
          from pyzotero import zotero
          import os

          z = zotero.Zotero(os.environ["ZOTERO_ID"], "user", os.environ["ZOTERO_KEY"])
          items = z.everything(z.items(itemType="conferencePaper || journalArticle || preprint"))
          items = [x for x in items if x.get("data", {}).get("title")]
          items.sort(key=lambda x: x.get("data", {}).get("dateAdded", ""), reverse=True)

          print("=== ZOTERO_LATEST_20_BEGIN ===")
          for i, item in enumerate(items[:20], 1):
              d = item["data"]
              title = " ".join(str(d.get("title", "")).split())
              added = d.get("dateAdded", "")
              pubdate = d.get("date", "")
              journal = d.get("publicationTitle", "") or d.get("proceedingsTitle", "")
              doi = d.get("DOI", "")
              print(f"{i:02d}\t{added}\t{pubdate}\t{journal}\t{doi}\t{title}")
          print("=== ZOTERO_LATEST_20_END ===")
          PY
