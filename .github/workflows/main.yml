name: Send emails daily

on:
  workflow_dispatch:
  # Taipei: prepare 04:17 / 06:43; wake 07:17; recovery 08:21.
  # Actual local time (not cron identity) decides whether publication is due.
  schedule:
    - cron: '17 20 * * *'
    - cron: '43 22 * * *'
    - cron: '17 23 * * *'
    - cron: '21 0 * * *'

permissions:
  contents: write

concurrency:
  group: v3-daily-recommendations
  cancel-in-progress: false

jobs:
  calculate-and-send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Recover SMTP-accepted archives without resending
        run: |
          if [ -d .daily-digest ]; then
            python daily_digest.py recover
            bash scripts/commit-digest.sh "Recover accepted research archives" .daily-digest site/data
          fi

      - name: Determine Taipei digest day and status
        id: plan
        run: python daily_digest.py plan

      - name: Setup uv
        if: steps.plan.outputs.phase == 'new' || steps.plan.outputs.phase == 'prepared'
        uses: astral-sh/setup-uv@v7

      - name: Prepare digest (no email or site publication)
        if: steps.plan.outputs.phase == 'new'
        env:
          DIGEST_DATE: ${{ steps.plan.outputs.day }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          ENABLE_CROSSREF: ${{ vars.ENABLE_CROSSREF }}
          JOURNAL_GROUPS: ${{ vars.JOURNAL_GROUPS }}
          RECOMMENDATION_COOLDOWN_DAYS: ${{ vars.RECOMMENDATION_COOLDOWN_DAYS }}
          CROSSREF_ROWS_PER_JOURNAL: ${{ vars.CROSSREF_ROWS_PER_JOURNAL }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          EXTRA_JOURNALS_JSON: ${{ vars.EXTRA_JOURNALS_JSON }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          PUBLISH_SITE: "true"
          SITE_OUTPUT_DIR: site
        run: uv run main.py --prepare-dir ".daily-digest/$DIGEST_DATE" --digest-date "$DIGEST_DATE"

      - name: Persist prepared digest
        if: steps.plan.outputs.phase == 'new'
        env:
          DIGEST_DATE: ${{ steps.plan.outputs.day }}
        run: bash scripts/commit-digest.sh "Prepare research digest $DIGEST_DATE" ".daily-digest/$DIGEST_DATE"

      - name: Warm the email runtime before publication
        if: steps.plan.outputs.phase == 'prepared'
        run: uv sync

      - name: Wait until 08:00 Taipei if publication is near
        id: due
        env:
          DIGEST_DATE: ${{ steps.plan.outputs.day }}
        run: python daily_digest.py ready "$DIGEST_DATE"

      - name: Claim and deliver today's email
        if: steps.due.outputs.send == 'true'
        env:
          DIGEST_DATE: ${{ steps.plan.outputs.day }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          uv run python daily_digest.py validate "$DIGEST_DATE"
          python daily_digest.py claim "$DIGEST_DATE"
          bash scripts/commit-digest.sh "Claim research email $DIGEST_DATE" ".daily-digest/$DIGEST_DATE"
          uv run python daily_digest.py send "$DIGEST_DATE"
          bash scripts/commit-digest.sh "SMTP accepted research email $DIGEST_DATE" ".daily-digest/$DIGEST_DATE"

      - name: Finalize accepted archive
        if: steps.due.outputs.send == 'true'
        env:
          DIGEST_DATE: ${{ steps.plan.outputs.day }}
        run: |
          python daily_digest.py finalize "$DIGEST_DATE"
          bash scripts/commit-digest.sh "Publish research archive $DIGEST_DATE" ".daily-digest/$DIGEST_DATE" site/data
